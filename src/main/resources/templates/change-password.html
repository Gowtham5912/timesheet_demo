<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="login-page">
<div class="login-card card">
    <div class="card-body">
        <div class="brand-logo">
            <div class="brand-logo__symbol">B</div>
            <div class="brand-logo__text">
                <h1>Blackfig Technologies</h1>
                <p>Update your account password</p>
            </div>
        </div>

        <div class="mb-4">
            <h2 class="login-title">Change Password</h2>
            <p class="login-subtitle">Secure your account with a new password.</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <form th:action="@{/change-password}" method="post">
            <div class="mb-3 input-group shadow-sm rounded overflow-hidden">
                <span class="input-group-text input-icon"><i class="bi bi-key-fill"></i></span>
                <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="New password" required autofocus>
            </div>
            <div class="mb-3 input-group shadow-sm rounded overflow-hidden">
                <span class="input-group-text input-icon"><i class="bi bi-key-fill"></i></span>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Save Password</button>
        </form>

        <div class="footer-note">You will be redirected to the portal after saving your new password.</div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
