<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="login-page">
<div class="login-card card">
    <div class="card-body">
        <div class="brand-logo">
            <div class="brand-logo__symbol">B</div>
            <div class="brand-logo__text">
                <h1>Blackfig Technologies Bengaluru</h1>
                <p>Enterprise timesheet portal</p>
            </div>
        </div>

        <div class="mb-4">
            <h2 class="login-title">Timesheet System</h2>
            <p class="login-subtitle">Enter your credentials to access your portal</p>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3 input-group shadow-sm rounded overflow-hidden">
                <span class="input-group-text input-icon"><i class="bi bi-person-fill"></i></span>
                <input type="text" id="username" name="username" class="form-control" placeholder="Username" required autofocus>
            </div>
            <div class="mb-3 input-group shadow-sm rounded overflow-hidden">
                <span class="input-group-text input-icon"><i class="bi bi-lock-fill"></i></span>
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>

        <div class="footer-note">Use standard provided credentials</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
