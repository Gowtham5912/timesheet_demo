services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: Sonu@123
      MYSQL_DATABASE: timesheet_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  timesheet-app:
    image: timesheet-app:latest
    container_name: timesheet-app
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8080"

volumes:
  mysql-data: